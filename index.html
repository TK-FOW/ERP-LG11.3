<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bürodesign GmbH – Finanzbuchhaltung (FOW 11 · LG 11.3)</title>
<style>
:root{--bg:#f1f2ee;--card:#fff;--ink:#1c2924;--mut:#606d67;--line:#dce1db;--gr:#17824a;--grd:#0d5a32;--grl:#e5f2e9;
--soll:#1a6c88;--solll:#e3f0f4;--hab:#ad5327;--habl:#f8eae1;--warn:#b3261e;--warnl:#fbe9e7;--amb:#8a6100;--ambl:#fdf3d7;--side:#1e2c27;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0 0 .8em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--mut)}
.small{font-size:.875rem}
/* Kopf */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--gr);position:relative;flex:none}
.mark:before{content:"";position:absolute;left:8px;right:8px;top:12px;height:3px;background:#fff;border-radius:2px}
.mark:after{content:"";position:absolute;left:17.5px;top:12px;bottom:8px;width:3px;background:#fff;border-radius:2px}
.wm{font-weight:300;letter-spacing:.2em;font-size:1.05rem;color:#4b5651;white-space:nowrap}
.tag{font-size:.72rem;font-weight:700;color:var(--gr);letter-spacing:.03em}
.topinfo{flex:1;min-width:180px;font-weight:600;font-size:.95rem}
.topbtn{display:flex;gap:6px;flex-wrap:wrap}
.topbtn button,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;min-height:42px;font-weight:600;font-size:.9rem}
.topbtn button:hover,.btn:hover{border-color:var(--gr);color:var(--grd)}
.btn.pri{background:var(--gr);border-color:var(--gr);color:#fff}
.btn.pri:hover{background:var(--grd);color:#fff}
.btn.ghost{background:transparent}
.btn.warn{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.82rem}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.chip.uebung{background:var(--grl);color:var(--grd)}
.chip.pruefung{background:var(--ambl);color:var(--amb)}
/* Layout */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 62px)}
.steps{background:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.steps button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#c9d3ce;padding:10px 10px;border-radius:9px;font-weight:600;font-size:.93rem;min-height:44px}
.steps button:hover{background:rgba(255,255,255,.07)}
.steps button.on{background:var(--gr);color:#fff}
.steps .n{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.78rem;flex:none}
.steps .done .n{background:#fff;color:var(--grd);border-color:#fff}
.steps .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#8fa098;padding:4px 10px 8px}
main{padding:22px clamp(14px,3vw,34px) 60px;max-width:1280px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid2>.card{margin:0}
.eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--gr);margin-bottom:4px}
.hero{background:linear-gradient(120deg,var(--grd),var(--gr));color:#fff;border-radius:var(--r);padding:26px 26px;margin-bottom:18px;position:relative;overflow:hidden}
.hero .eyebrow{color:#bfe5cc}
.hero p{margin:0;opacity:.92;max-width:60ch}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:230px;height:230px;border-radius:50%;border:34px solid rgba(255,255,255,.08)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead p{margin:0;color:var(--mut);max-width:70ch}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--mut);margin-bottom:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-weight:400;color:var(--ink);min-height:42px}
textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:8px 14px;min-height:42px;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--gr);color:#fff}
.opt{margin-bottom:14px}
.opt .t{font-size:.82rem;font-weight:600;color:var(--mut);margin-bottom:5px}
.opt .d{font-size:.82rem;color:var(--mut);margin-top:5px}
/* Infoboxen */
.info{border-left:4px solid var(--gr);background:var(--grl);border-radius:0 9px 9px 0;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.info.amb{border-color:#c79a1a;background:var(--ambl)}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.95rem}
.fb.ok{background:var(--grl);color:var(--grd);border:1px solid #b9dcc5}
.fb.err{background:var(--warnl);color:#7d1a14;border:1px solid #f0c1bc}
.fb.info{background:var(--ambl);color:#5e4300;border:1px solid #ecd9a0}
/* Geschäftsfälle */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchips button{min-width:44px;min-height:40px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;padding:4px 10px}
.fchips button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.fchips button.fertig,.fchips button.gebucht{background:var(--grl);color:var(--grd);border-color:#b9dcc5}
.fchips button.teil{background:var(--ambl);color:var(--amb);border-color:#ecd9a0}
.ft{font-size:.98rem}
.fl{display:flex;justify-content:space-between;gap:16px;padding:1px 0}
.beleg{background:#fbfbf8;border:1px dashed #c9d0c8;border-radius:10px;padding:12px 14px}
.belegimg{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px}
/* Buchungssatz */
.bs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.bs .col{border-radius:10px;padding:12px}
.bs .col.S{background:var(--solll)}
.bs .col.H{background:var(--habl)}
.bs h3{display:flex;justify-content:space-between;margin-bottom:8px}
.bs .col.S h3{color:var(--soll)}
.bs .col.H h3{color:var(--hab)}
.zeile{display:grid;grid-template-columns:minmax(0,1fr) 130px 36px;gap:6px;margin-bottom:8px}
.kbtn{border:1px solid var(--line);background:#fff;border-radius:9px;min-height:44px;padding:6px 10px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbtn .ph{color:var(--mut)}
.zeile input{border:1px solid var(--line);border-radius:9px;min-height:44px;padding:6px 10px;text-align:right;width:100%;font-variant-numeric:tabular-nums}
.zeile .x{border:0;background:transparent;font-size:1.3rem;color:var(--mut);border-radius:8px}
.zeile .hint{grid-column:1/-1;font-size:.8rem;color:var(--mut);margin-top:-2px}
.addrow{border:1px dashed currentColor;background:transparent;border-radius:9px;min-height:38px;padding:4px 12px;font-size:.85rem;font-weight:600;opacity:.8}
.waage{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:10px;background:#f6f7f4;border:1px solid var(--line);font-size:.92rem}
.waage b{font-variant-numeric:tabular-nums}
.waage .st{margin-left:auto;font-weight:700}
.waage.ok{background:var(--grl);border-color:#b9dcc5}
.waage.ok .st{color:var(--grd)}
.waage.no .st{color:var(--warn)}
/* Tabellen */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);white-space:nowrap}
td.num,th.num{text-align:right}
tr.first td{border-top:1.5px solid #b9c1ba}
tr.st td{text-decoration:line-through;color:var(--mut)}
.cS{color:var(--soll);font-weight:600}
.cH{color:var(--hab);font-weight:600}
/* T-Konten */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.tk{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;break-inside:avoid}
.tk .hd{display:grid;grid-template-columns:22px 1fr 22px;align-items:center;padding:7px 10px;border-bottom:2.5px solid var(--ink);font-weight:700;font-size:.9rem;text-align:center}
.tk .hd .s{color:var(--soll);text-align:left}
.tk .hd .h{color:var(--hab);text-align:right}
.tk .ty{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;color:var(--mut)}
.tk.A{border-top:4px solid var(--soll)}.tk.P{border-top:4px solid var(--hab)}.tk.W{border-top:4px solid #7a5aa8}.tk.E{border-top:4px solid var(--gr)}.tk.X{border-top:4px solid #555}
.tk .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tk .side{padding:5px 8px 6px;min-height:58px;font-size:.8rem;min-width:0}
.tk .side.S{border-right:2.5px solid var(--ink)}
.tk .side .rg{font-size:.68rem;color:var(--mut);font-style:italic;margin-bottom:3px}
.tk .ln{display:flex;justify-content:space-between;gap:6px}
.tk .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.tk .ln.sb span:first-child{color:var(--ink);font-weight:600}
.tk .sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-size:.8rem;font-weight:700}
.tk .sum div{padding:4px 8px;text-align:right;border-top:1px solid var(--ink);font-variant-numeric:tabular-nums}
.tk .sum div:first-child{border-right:2.5px solid var(--ink)}
.tk.zu .sum div{border-bottom:3px double var(--ink)}
.tk .side.ziel{background:repeating-linear-gradient(135deg,#fffbe8,#fffbe8 8px,#fff4c4 8px,#fff4c4 16px);cursor:pointer}
.tray{position:sticky;top:64px;z-index:10;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.tray .cs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:132px;overflow:auto}
.pc{border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px 9px;font-size:.82rem;min-height:38px}
.pc.S{border-left:5px solid var(--soll)}.pc.H{border-left:5px solid var(--hab)}
.pc.on{background:var(--ink);color:#fff}
/* Bilanz */
.bil{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.bil .bh{display:grid;grid-template-columns:1fr auto 1fr;padding:9px 12px;border-bottom:2.5px solid var(--ink);font-weight:700;align-items:center}
.bil .bh span:last-child{text-align:right}
.bil .bb{display:grid;grid-template-columns:1fr 1fr}
.bil .bs2{padding:8px 12px}
.bil .bs2:first-child{border-right:2.5px solid var(--ink)}
.bg{font-weight:700;font-size:.82rem;margin:8px 0 2px;color:var(--grd)}
.bz{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:1px 0}
.bz.vor{color:var(--amb);font-style:italic}
.bil .bf{display:grid;grid-template-columns:1fr 1fr;font-weight:700}
.bil .bf div{padding:8px 12px;display:flex;justify-content:space-between;border-top:1px solid var(--ink)}
.bil .bf div:first-child{border-right:2.5px solid var(--ink)}
.bil.eq .bf div{border-bottom:3px double var(--ink)}
.pos{color:var(--grd)}.neg{color:var(--warn)}
/* Kennzahlen */
.kzb{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:16px}
.kzb button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;text-align:left;font-weight:600;min-height:54px}
.kzb button.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.formel{font-family:Georgia,"Times New Roman",serif;font-size:1.1rem;background:#f6f7f4;border-radius:10px;padding:12px 14px;margin:8px 0 14px}
.erg{font-size:1.5rem;font-weight:700;color:var(--grd)}
/* Abschluss */
.ag{font-weight:700;margin:16px 0 6px;display:flex;gap:8px;align-items:center}
.ag .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.75rem}
.arow{display:grid;grid-template-columns:minmax(150px,1.4fr) 1fr 1fr 130px minmax(150px,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.arow input,.arow select{border:1px solid var(--line);border-radius:8px;min-height:40px;padding:4px 8px;width:100%;background:#fff}
.arow input{text-align:right}
.arow.zu{color:var(--mut)}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,30,26,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.dlg{background:#fff;border-radius:14px;width:min(680px,100%);padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.dlg .dh h2{margin:0}
.klist{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.klist .kh{position:sticky;top:0;background:#f1f2ee;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;color:var(--mut)}
.klist button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:9px 10px;text-align:left;min-height:44px}
.klist button:hover{background:var(--grl)}
.klist button.sub{padding-left:28px;font-size:.92rem}
.klist .ty{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--mut);white-space:nowrap}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
.rule b{display:block;margin-bottom:3px}
.rule .tt{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);margin-top:6px;font-size:.8rem}
.rule .tt div{padding:4px 6px}.rule .tt div:first-child{border-right:2px solid var(--ink)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:80;max-width:92vw;display:none;font-size:.93rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.err{background:#8c1d18}
.edf{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fbfbf8}
.edf .r{display:grid;grid-template-columns:90px 1fr;gap:10px}
#druck{display:none}
@media (max-width:900px){
 .layout{grid-template-columns:minmax(0,1fr)}
 .top{padding:8px 12px;gap:8px}
 .topbtn button{min-height:38px;padding:5px 10px;font-size:.82rem}
 .fl span:first-child{min-width:0}
 .steps{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;position:sticky;top:0;z-index:15}
 .steps .lbl{display:none}
 .steps button{width:auto;white-space:nowrap;padding:8px 12px}
 .top{position:static}
 .tray{top:60px}
 .bs{grid-template-columns:1fr}
 .arow{grid-template-columns:1fr 1fr;}
 .arow>:first-child{grid-column:1/-1;font-weight:600}
 .rules{grid-template-columns:1fr}
 .bil .bb,.bil .bf{grid-template-columns:1fr}
 .bil .bs2:first-child,.bil .bf div:first-child{border-right:0;border-bottom:1px solid var(--line)}
 .wm{font-size:.9rem;letter-spacing:.14em}
}
@media print{
 @page{margin:14mm}
 body{background:#fff;font-size:10.5pt}
 #app,#modal,#toast{display:none!important}
 #druck{display:block}
 #druck h1{font-size:16pt}#druck h2{font-size:12.5pt;margin-top:16pt;border-bottom:1px solid #999;padding-bottom:3pt}
 .tgrid{grid-template-columns:1fr 1fr;gap:8pt}
 .tk,.bil,.card{border-color:#999}
 .tw{overflow:visible}
 table{font-size:8.5pt}th,td{padding:2.5pt 4pt}th{white-space:normal;letter-spacing:0}
 tr{break-inside:avoid}
 .card{padding:8pt;margin-bottom:8pt}
 .dk{display:flex;justify-content:space-between;gap:20pt;border-bottom:2px solid #000;padding-bottom:6pt;margin-bottom:8pt}
 .bil .bb,.bil .bf{grid-template-columns:1fr 1fr!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast" role="status"></div><div id="druck"></div>
<input type="file" id="datei" hidden accept=".json,application/json,image/*">

const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseBetrag(s){if(typeof s==='number')return Math.round(s*100);s=String(s==null?'':s).replace(/[€\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');if(!/^\d+(\.\d{1,2})?$/.test(s))return NaN;return Math.round(parseFloat(s)*100);}
const fmt=c=>(c/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>x==null?'–':x.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' %';
function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s).split('').reverse().join('');}
function dec(t){const s=atob(t.split('').reverse().join(''));const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b));}
let toastT=null;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',err?5200:2800);}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const dateiName=s=>String(s||'datei').replace(/[^\wäöüÄÖÜß-]+/g,'_').slice(0,50);

/* ---------- Zustand ---------- */
let S=null,FAELLE=[],AK=[],FB=null,PICK=null,MODAL=null,AD={},ADV={},ED=null,REPO=[],PV={};
const leerDraft=()=>({S:[{k:'',b:''}],H:[{k:'',b:''}]});
function neuerStand(A,alt){return {v:1,aufgabe:A,name:alt?alt.name:'',klasse:alt?alt.klasse:'',modus:alt?alt.modus:'uebung',hilfen:alt?alt.hilfen:true,auto:alt?alt.auto:false,view:'start',fall:null,fallA:null,buch:[],draft:leerDraft(),versuche:{},geloest:{},ausgewertet:false,kz:null,kzOffen:{},hbf:'alle',pick:null,vgl:false,seq:0};}
function konto(nr){const b=KP[nr],n=S&&S.aufgabe&&S.aufgabe.kontonamen&&S.aufgabe.kontonamen[nr];if(b)return n?Object.assign({},b,{name:n}):b;return {nr,name:n||('Konto '+nr),typ:typVon(nr),sub:false,parent:null};}
const kname=nr=>nr+' '+konto(nr).name;
const kkurz=nr=>nr+' '+(KURZ[nr]||konto(nr).name);
function alleFaelle(){const A=S.aufgabe,r=[];
 if(A.einst.eroeffnung==='manuell')r.push({id:'E',nr:'EB',grp:'eb',text:'Eröffnungsbuchungen: Eröffne alle Bestandskonten über das Eröffnungsbilanzkonto (8000).\nAktivkonten: Konto an 8000 · Passivkonten: 8000 an Konto',teile:A.ab.map(x=>typVon(x.k)==='A'?{s:[{k:x.k,b:x.b}],h:[{k:'8000',b:x.b}]}:{s:[{k:'8000',b:x.b}],h:[{k:x.k,b:x.b}]})});
 A.faelle.forEach((f,i)=>r.push(Object.assign({id:'F'+i,grp:'lauf'},f)));
 (A.abschluss||[]).forEach((f,i)=>r.push(Object.assign({id:'A'+i,grp:'vab'},f)));return r;}
function vorbereiten(){const A=S.aufgabe;FAELLE=alleFaelle();const set=new Set();A.ab.forEach(x=>set.add(x.k));FAELLE.forEach(f=>f.teile.forEach(t=>t.s.concat(t.h).forEach(x=>set.add(x.k))));(A.zusatz||[]).forEach(k=>set.add(k));AK=[...set].sort();AD={};ADV={};PV={};}
function eroeffnen(){if(S.aufgabe.einst.eroeffnung==='manuell')return;S.aufgabe.ab.forEach(x=>{const a=typVon(x.k)==='A';S.buch.push({id:++S.seq,nr:0,fall:'EB',typ:'eb',z:[{s:a?'S':'H',k:x.k,b:x.b,p:true},{s:a?'H':'S',k:'8000',b:x.b,p:true}]});});}
function ladeAufgabe(A,alt){S=neuerStand(A,alt);vorbereiten();eroeffnen();FB=null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({d:enc(S)}));}catch(e){if(!save.warned){save.warned=true;toast('Automatisches Zwischenspeichern nicht möglich – bitte den Stand über „Speichern / Laden“ als Datei sichern.',true);}}}
function restore(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.d){S=dec(r.d);if(S&&S.aufgabe){vorbereiten();return true;}}}catch(e){}return false;}
function normAufgabe(A){A.einst=Object.assign({eroeffnung:'auto',guv:'3000',kontenauswahl:'aufgabe'},A.einst||{});A.ab=A.ab||[];A.faelle=A.faelle||[];A.abschluss=A.abschluss||[];A.kontonamen=A.kontonamen||{};A.zusatz=A.zusatz||[];if(!A.id)A.id='a'+Date.now();return A;}

/* ---------- Rechenkern ---------- */
function salden(o){o=o||{};const m={};S.buch.forEach(e=>{if(o.ohneAbschl&&e.typ==='abschl')return;if(o.ohneSBK&&e.z.some(z=>z.k==='8010'))return;e.z.forEach(z=>{if(!z.p)return;m[z.k]=(m[z.k]||0)+(z.s==='S'?z.b:-z.b);});});return m;}
function ebSalden(){const m={};S.aufgabe.ab.forEach(x=>{m[x.k]=(m[x.k]||0)+(typVon(x.k)==='A'?x.b:-x.b);});return m;}
function bilanzAus(m){const akt=[],pas=[];let rest=0;Object.keys(m).sort().forEach(k=>{const v=m[k];if(!v||k==='8000'||k==='8010')return;const t=konto(k).typ;if(t==='A')akt.push({k,v});else if(t==='P')pas.push({k,v:-v});else rest-=v;});const su=a=>a.reduce((x,y)=>x+y.v,0);return {akt,pas,rest,sa:su(akt),sp:su(pas)+rest};}
function kat(b){const g={av:0,uv:0,vor:0,ford:0,fl:0,ek:b.rest,kfk:0,lfk:0};
 b.akt.forEach(x=>{const p=x.k.slice(0,2);if(x.k[0]<'2')g.av+=x.v;else{g.uv+=x.v;if(p>='20'&&p<='23')g.vor+=x.v;else if(p==='27'||p==='28')g.fl+=x.v;else g.ford+=x.v;}});
 b.pas.forEach(x=>{if(x.k<'3700')g.ek+=x.v;else if(/^(37|41)/.test(x.k)||x.k==='4250')g.lfk+=x.v;else g.kfk+=x.v;});
 g.fk=g.kfk+g.lfk;g.gk=g.ek+g.fk;g.gv=g.av+g.uv;return g;}
function erfolg(){const m=salden({ohneAbschl:true});let gew=0,ums=0;for(const k in m){const t=konto(k).typ;if(t==='E'||t==='W')gew-=m[k];if(/^5[01]/.test(k))ums-=m[k];}return {gew,ums};}
const agg=lines=>{const m={};lines.forEach(l=>{const key=l.s+l.k;m[key]=(m[key]||0)+l.b;});return m;};
const teilLines=t=>t.s.map(x=>({s:'S',k:x.k,b:x.b})).concat(t.h.map(x=>({s:'H',k:x.k,b:x.b})));
function diff(a,t){const iss=[],ka=new Set(Object.keys(a).map(x=>x.slice(1))),kt=new Set(Object.keys(t).map(x=>x.slice(1)));
 ka.forEach(k=>{if(!kt.has(k))iss.push({art:'fremd',k});});
 kt.forEach(k=>{if(!ka.has(k))iss.push({art:'fehlt',k});});
 ka.forEach(k=>{if(!kt.has(k))return;const aS=a['S'+k]||0,aH=a['H'+k]||0,tS=t['S'+k]||0,tH=t['H'+k]||0;if(aS===tS&&aH===tH)return;if((aS&&!tS)||(aH&&!tH))iss.push({art:'seite',k});else iss.push({art:'betrag',k});});
 return iss;}
function fallBuchungen(f){return S.buch.filter(e=>e.fall===f.id&&!e.st&&e.typ!=='storno');}
function erledigteTeile(f){const d=new Set();fallBuchungen(f).forEach(e=>(e.teile||[]).forEach(t=>d.add(t)));return d;}
function fallStatus(f){const es=fallBuchungen(f);if(S.modus==='uebung'){const d=erledigteTeile(f);return d.size>=f.teile.length?'fertig':d.size?'teil':'offen';}return es.length?'gebucht':'offen';}
function pruefe(f,lines){const d=erledigteTeile(f),R=f.teile.map((t,i)=>i).filter(i=>!d.has(i)),a=agg(lines);let best=null;
 const test=sub=>{const t=agg(sub.flatMap(i=>teilLines(f.teile[i]))),iss=diff(a,t);if(!iss.length)return true;if(!best||iss.length<best.iss.length||(iss.length===best.iss.length&&sub.length<best.sub.length))best={iss,sub};return false;};
 if(R.length<=12){for(let mask=1;mask<(1<<R.length);mask++){const sub=R.filter((x,j)=>mask>>j&1);if(test(sub))return {ok:true,teile:sub};}}
 else{for(const i of R)if(test([i]))return {ok:true,teile:[i]};if(test(R))return {ok:true,teile:R};}
 return {ok:false,iss:best?best.iss:[]};}
function hinweis(iss,n){const ord=['fremd','fehlt','seite','betrag'];const i=iss.slice().sort((x,y)=>ord.indexOf(x.art)-ord.indexOf(y.art))[0];if(!i)return 'Diese Buchung passt noch nicht.';const K=konto(i.k);
 if(n<=1){return {fremd:'Mindestens ein Konto gehört nicht zu diesem Geschäftsfall. Überlege noch einmal: Welche Konten werden berührt?',
  fehlt:'Es fehlt noch mindestens ein Konto.'+(/^(2600|4800)$/.test(i.k)?' Tipp: Achte auf die Umsatzsteuer.':' Was verändert sich durch den Geschäftsfall außerdem?'),
  seite:'Die Konten passen, aber mindestens ein Konto steht auf der falschen Seite. Frage dich: Welche Kontoart? Mehrung oder Minderung?',
  betrag:'Konten und Seiten stimmen. Prüfe die Beträge (netto, Umsatzsteuer, Rechnungsbetrag).'}[i.art];}
 return {fremd:'Das Konto '+kname(i.k)+' wird bei diesem Geschäftsfall nicht berührt.',
  fehlt:i.k==='2600'?'Es fehlt die Vorsteuer: Die Umsatzsteuer aus Eingangsrechnungen wird auf dem Konto 2600 erfasst.':i.k==='4800'?'Es fehlt die Umsatzsteuer: Beim Verkauf wird sie auf dem Konto 4800 erfasst.':'Es fehlt noch ein '+TYPNAME[K.typ]+' aus der Kontenklasse '+i.k[0]+'.',
  seite:'Das Konto '+kname(i.k)+' steht auf der falschen Seite. '+(K.sub?'':REGEL[K.typ]),
  betrag:'Der Betrag beim Konto '+kname(i.k)+' stimmt nicht.'}[i.art];}
function naechsteNr(){return S.buch.reduce((m,e)=>Math.max(m,e.nr||0),0)+1;}
function unposted(){const r=[];S.buch.forEach(e=>e.z.forEach((z,i)=>{if(!z.p)r.push({e,z,i});}));return r;}
function zielKonto(k){const K=konto(k);if(k==='8020')return S.aufgabe.einst.guv||'3000';if(K.sub&&K.parent)return K.parent;if(K.typ==='E'||K.typ==='W')return '8020';return '8010';}
function abschlussListe(){const m=salden(),g={sub:[],erf:[],guv:[],best:[]};const beruehrt=new Set();S.buch.forEach(e=>e.z.forEach(z=>{if(z.p)beruehrt.add(z.k);}));
 [...beruehrt].sort().forEach(k=>{if(k==='8000'||k==='8010')return;const K=konto(k),it={k,saldo:m[k]||0,ziel:zielKonto(k)};if(k==='8020')g.guv.push(it);else if(K.sub)g.sub.push(it);else if(K.typ==='E'||K.typ==='W')g.erf.push(it);else g.best.push(it);});return g;}
const offen=a=>a.some(x=>x.saldo!==0);
function abschlussFertig(){const g=abschlussListe();return S.buch.some(e=>e.typ==='abschl')&&!offen(g.sub)&&!offen(g.erf)&&!offen(g.guv)&&!offen(g.best);}
function gruppeFertig(g){return FAELLE.filter(f=>g==='vab'?f.grp==='vab':f.grp!=='vab').every(f=>{const s=fallStatus(f);return s==='fertig'||s==='gebucht';});}
function schliesse(k,ziel){const s=salden()[k]||0;if(!s)return;const b=Math.abs(s);S.buch.push({id:++S.seq,nr:naechsteNr(),fall:'Z',typ:'abschl',z:s>0?[{s:'S',k:ziel,b,p:true},{s:'H',k,b,p:true}]:[{s:'S',k,b,p:true},{s:'H',k:ziel,b,p:true}]});}
function auswertung(){return FAELLE.map(f=>{const a=agg(fallBuchungen(f).flatMap(e=>e.z)),t=agg(f.teile.flatMap(teilLines));const ok=Object.keys(Object.assign({},a,t)).every(k=>(a[k]||0)===(t[k]||0));return {f,ok,leer:!Object.keys(a).length};});}
function sollWerte(){const m=ebSalden();FAELLE.forEach(f=>{if(f.grp==='eb')return;f.teile.flatMap(teilLines).forEach(l=>{m[l.k]=(m[l.k]||0)+(l.s==='S'?l.b:-l.b);});});const b=bilanzAus(m);return {gew:b.rest,summe:b.sa};}

/* ---------- Bausteine ---------- */
function fallText(t){return '<div class="ft">'+String(t||'').split('\n').map(l=>{const p=l.split('|');return p.length>1?'<div class="fl"><span>'+esc(p[0].trim())+'</span><span class="num">'+esc(p.slice(1).join('|').trim())+'</span></div>':'<div class="fl"><span>'+esc(l)+'</span></div>';}).join('')+'</div>';}
function lsgText(teile,namen){return teile.map(t=>t.s.map(x=>(namen?kname(x.k):x.k)+' '+fmt(x.b)).join(' + ')+' an '+t.h.map(x=>(namen?kname(x.k):x.k)+' '+fmt(x.b)).join(' + ')).join('\n');}
function bilanzHtml(b,titel){
 const z=x=>'<div class="bz'+(x.vor?' vor':'')+'"><span>'+(x.k?esc(kname(x.k)):esc(x.n))+'</span><span class="num">'+fmt(x.v)+'</span></div>';
 const sec=(t,a)=>a.length?'<div class="bg">'+t+'</div>'+a.map(z).join(''):'';
 const ek=b.pas.filter(x=>x.k<'3700');if(b.rest)ek.push({n:b.rest>0?'Vorläufiger Gewinn (Erfolgskonten noch nicht abgeschlossen)':'Vorläufiger Verlust (Erfolgskonten noch nicht abgeschlossen)',v:b.rest,vor:true});
 return '<div class="bil'+(b.sa===b.sp&&b.sa?' eq':'')+'"><div class="bh"><span>Aktiva</span><span>'+esc(titel)+'</span><span>Passiva</span></div><div class="bb"><div class="bs2">'+sec('A. Anlagevermögen',b.akt.filter(x=>x.k[0]<'2'))+sec('B. Umlaufvermögen',b.akt.filter(x=>x.k[0]==='2'))+'</div><div class="bs2">'+sec('A. Eigenkapital',ek)+sec('B. Fremdkapital',b.pas.filter(x=>x.k>='3700'))+'</div></div><div class="bf"><div><span>Bilanzsumme</span><span class="num">'+fmt(b.sa)+'</span></div><div><span>Bilanzsumme</span><span class="num">'+fmt(b.sp)+'</span></div></div></div>';}
function fallLabel(e){if(e.typ==='storno')return 'Storno';if(e.fall==='Z')return 'Abschluss';const f=FAELLE.find(x=>x.id===e.fall);return f?(f.grp==='vab'?'Abschl. '+f.nr:f.nr):'';}
function gbTabelle(druck){const es=S.buch.filter(e=>e.nr);if(!es.length)return '<p class="muted">Noch keine Buchungen im Grundbuch.</p>';const storno=!druck&&S.modus==='pruefung'&&!S.ausgewertet;
 let h='<div class="tw"><table><thead><tr><th>Nr.</th><th>Fall</th><th>Soll-Konto</th><th>Haben-Konto</th><th class="num">Betrag Soll €</th><th class="num">Betrag Haben €</th>'+(storno?'<th></th>':'')+'</tr></thead><tbody>';
 es.forEach(e=>{const so=e.z.filter(z=>z.s==='S'),ha=e.z.filter(z=>z.s==='H');let first=true;const row=(z,side)=>{h+='<tr class="'+(first?'first ':'')+(e.st?'st':'')+'"><td>'+(first?e.nr:'')+'</td><td>'+(first?esc(fallLabel(e)):'')+'</td><td class="cS">'+(side==='S'?esc(kname(z.k)):'')+'</td><td class="cH">'+(side==='H'?'an '+esc(kname(z.k)):'')+'</td><td class="num">'+(side==='S'?fmt(z.b):'')+'</td><td class="num">'+(side==='H'?fmt(z.b):'')+'</td>'+(storno?'<td>'+(first&&!e.st&&e.typ!=='storno'&&e.typ!=='abschl'?'<button class="btn sm warn" data-a="storno" data-id="'+e.id+'">Stornieren</button>':'')+'</td>':'')+'</tr>';first=false;};so.forEach(z=>row(z,'S'));ha.forEach(z=>row(z,'H'));});
 return h+'</tbody></table></div>';}
function tkonto(k){const K=konto(k);let L='',R='',sl=0,sr=0,zu=false;
 S.buch.forEach(e=>{e.z.forEach(z=>{if(z.k!==k||!z.p)return;const g=e.z.filter(y=>y.s!==z.s);let lab=e.typ==='eb'?'AB':g.length===1?kkurz(g[0].k):'diverse';if(e.typ==='abschl'){zu=true;}const ln='<div class="ln'+(e.typ==='abschl'?' sb':'')+'"><span title="'+esc(lab)+'">'+(e.nr?e.nr+') ':'')+esc(lab)+'</span><span class="num">'+fmt(z.b)+'</span></div>';if(z.s==='S'){L+=ln;sl+=z.b;}else{R+=ln;sr+=z.b;}});});
 const zl=S.pick?' ziel':'';const rg=S.hilfen&&S.modus==='uebung'?{A:['AB · Mehrungen','Minderungen · SB'],P:['Minderungen · SB','AB · Mehrungen'],W:['Aufwendungen','Saldo → GuV'],E:['Saldo → GuV','Erträge'],X:['','']}[K.sub?'X':K.typ]:['',''];
 return '<div class="tk '+K.typ+(zu&&sl===sr?' zu':'')+'"><div class="hd"><span class="s">S</span><span>'+esc(kname(k))+'<span class="ty">'+(K.sub?'Unterkonto':TYPNAME[K.typ])+'</span></span><span class="h">H</span></div><div class="body"><div class="side S'+zl+'" data-a="post" data-k="'+k+'" data-s="S">'+(rg[0]?'<div class="rg">'+rg[0]+'</div>':'')+L+'</div><div class="side H'+zl+'" data-a="post" data-k="'+k+'" data-s="H">'+(rg[1]?'<div class="rg">'+rg[1]+'</div>':'')+R+'</div></div><div class="sum"><div>'+fmt(sl)+'</div><div>'+fmt(sr)+'</div></div></div>';}
function hbKonten(){const set=new Set(AK);S.buch.forEach(e=>e.z.forEach(z=>set.add(z.k)));if(S.aufgabe.einst.eroeffnung!=='manuell')set.delete('8000');return [...set].sort();}

/* ---------- Ansichten ---------- */
const VIEWS=[['start','Aufgabe'],['eb','Eröffnungsbilanz'],['gb','Grundbuch'],['hb','Hauptbuch'],['ab','Abschluss'],['sb','Schlussbilanz'],['kz','Kennzahlen']];
function viewDone(v){if(v==='gb')return gruppeFertig('lauf');if(v==='hb')return gruppeFertig('lauf')&&!unposted().length&&S.buch.some(e=>e.nr);if(v==='ab'||v==='sb')return abschlussFertig();return false;}
function shell(){const ed=S.view==='editor';
 return '<header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span><div><div class="wm">BÜRODESIGN GMBH</div><div class="tag">Finanzbuchhaltung · Lerngebiet 11.3</div></div></div><div class="topinfo">'+(ed?'Lehrkraft: Aufgabe erstellen':esc(S.aufgabe.titel)+'<span class="chip '+S.modus+'">'+(S.modus==='uebung'?'Übungsmodus':'Prüfungsmodus')+'</span>')+'</div><div class="topbtn"><button data-a="hilfe">Buchungsregeln</button><button data-a="aufgaben">Aufgaben</button><button data-a="dateien">Speichern / Laden</button><button data-a="pdf">Drucken / PDF</button></div></header>'+
 '<div class="layout"><nav class="steps" aria-label="Arbeitsschritte"><div class="lbl">Buchungskreislauf</div>'+VIEWS.map((v,i)=>'<button class="'+(S.view===v[0]?'on ':'')+(viewDone(v[0])?'done':'')+'" data-a="nav" data-v="'+v[0]+'"><span class="n">'+(viewDone(v[0])?'✓':i+1)+'</span>'+v[1]+'</button>').join('')+'</nav><main>'+({start:vStart,eb:vEB,gb:vGB,hb:vHB,ab:vAB,sb:vSB,kz:vKZ,editor:vEditor}[S.view]||vStart)()+(ed?'':fuss())+'</main></div>';}
function fuss(){const i=VIEWS.findIndex(v=>v[0]===S.view);return '<div class="foot">'+(i>0?'<button class="btn" data-a="nav" data-v="'+VIEWS[i-1][0]+'">← '+VIEWS[i-1][1]+'</button>':'<span></span>')+(i<VIEWS.length-1?'<button class="btn pri" data-a="nav" data-v="'+VIEWS[i+1][0]+'">Weiter: '+VIEWS[i+1][1]+' →</button>':'')+'</div>';}
function seg(act,val,opts){return '<div class="seg">'+opts.map(o=>'<button class="'+(String(val)===String(o[0])?'on':'')+'" data-a="'+act+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';}

 pickk(d){S.draft[PICK.s][PICK.i].k=d.k;MODAL=null;PICK=null;render();},
 buchen(d){const g=d.g,f=aktFall(g),lines=[];let err=null;
  ['S','H'].forEach(s=>S.draft[s].forEach(r=>{if(!r.k&&!String(r.b).trim())return;const b=parseBetrag(r.b);if(!r.k)err='Bitte in jeder Zeile ein Konto wählen.';else if(isNaN(b)||b<=0)err='Bitte in jeder Zeile einen gültigen Betrag eingeben (z. B. 1.250,00).';else lines.push({s,k:r.k,b});}));
  const su=s=>lines.filter(l=>l.s===s).reduce((x,y)=>x+y.b,0);
  if(!err&&(!su('S')||!su('H')))err='Ein Buchungssatz braucht mindestens ein Konto im Soll und eines im Haben.';
  if(!err&&su('S')!==su('H'))err='Soll und Haben sind nicht gleich groß (Differenz: '+fmt(Math.abs(su('S')-su('H')))+' €).';
  if(err){FB={g,t:'err',html:esc(err)};render();return;}
  const e={id:++S.seq,nr:0,fall:f.id,typ:f.grp==='vab'?'vab':f.grp==='eb'?'ebm':'lauf',z:lines.map(l=>({s:l.s,k:l.k,b:l.b,p:S.auto||f.grp==='vab'}))};
  if(S.modus==='uebung'){const r=pruefe(f,lines);if(!r.ok){const n=S.versuche[f.id]=(S.versuche[f.id]||0)+1;FB={g,t:'err',html:esc(hinweis(r.iss,n))+(n>=3?'<div style="margin-top:8px"><button class="btn sm" data-a="loesung" data-g="'+g+'">Lösung anzeigen</button></div>':n===2?'':'')};render();return;}e.teile=r.teile;}
  e.nr=naechsteNr();S.buch.push(e);resetDraft();const st=fallStatus(f);
  FB={g,t:'ok',html:S.modus==='uebung'?(st==='fertig'?'✓ Richtig gebucht (Nr. '+e.nr+').':'✓ Richtig – dieser Teil ist gebucht (Nr. '+e.nr+'). Der Fall hat noch weitere Buchungen.')+(e.z.some(z=>!z.p)?' Übertrage die Buchung jetzt ins Hauptbuch.':''):'Buchung Nr. '+e.nr+' wurde erfasst.'};
  if(S.modus==='pruefung'&&f.teile.length>1)FB.html+=' Gehören zu diesem Fall weitere Buchungen, erfasse sie jetzt – sonst wähle oben den nächsten Fall.';
  if(st==='fertig'||(st==='gebucht'&&f.teile.length===1)){const fs=FAELLE.filter(x=>g==='vab'?x.grp==='vab':x.grp!=='vab'),nx=fs.find(x=>fallStatus(x)==='offen'||fallStatus(x)==='teil');if(nx)S[g==='vab'?'fallA':'fall']=nx.id;else FB.html+=' <b>Alle '+(g==='vab'?'vorbereitenden Abschlussbuchungen':'Geschäftsfälle')+' sind gebucht.</b>';}
  render();},
 loesung(d){const f=aktFall(d.g),done=erledigteTeile(f),i=f.teile.findIndex((t,j)=>!done.has(j));if(i<0)return;const t=f.teile[i];S.geloest[f.id]=true;S.draft={S:t.s.map(x=>({k:x.k,b:fmt(x.b)})),H:t.h.map(x=>({k:x.k,b:fmt(x.b)}))};FB={g:d.g,t:'info',html:'Die Lösung ist eingetragen. Vollziehe sie nach (Kontoart? Mehrung oder Minderung?) und klicke dann auf „Buchen“.'};render();},
 storno(d){const e=S.buch.find(x=>x.id===+d.id);if(!e||e.st)return;if(!confirm('Buchung Nr. '+e.nr+' stornieren? Es wird eine Gegenbuchung erzeugt.'))return;e.st=true;S.buch.push({id:++S.seq,nr:naechsteNr(),fall:e.fall,typ:'storno',st:true,z:e.z.map(z=>({s:z.s==='S'?'H':'S',k:z.k,b:z.b,p:z.p}))});render();},
 chip(d){const same=S.pick&&S.pick.id===+d.id&&S.pick.i===+d.i;S.pick=same?null:{id:+d.id,i:+d.i};render();},
 post(d){if(!S.pick)return;const e=S.buch.find(x=>x.id===S.pick.id),z=e&&e.z[S.pick.i];if(!z)return;if(z.k!==d.k){const key=e.id+'-'+S.pick.i;PV[key]=(PV[key]||0)+1;toast(PV[key]>1?'Im Grundbuch steht für diesen Posten das Konto '+kname(z.k)+'.':'Dieser Posten gehört auf ein anderes Konto. Sieh im Grundbuch nach.',true);return;}if(z.s!==d.s){toast('Richtiges Konto, aber falsche Seite: Im Grundbuch steht das Konto im '+(z.s==='S'?'Soll (links)':'Haben (rechts)')+'.',true);return;}z.p=true;S.pick=null;render();},
 setauto(d){S.auto=d.v==='1';if(S.auto){S.buch.forEach(e=>e.z.forEach(z=>z.p=true));S.pick=null;}render();},
 sethilfen(d){S.hilfen=d.v==='1';render();},
 setmodus(d){if(d.v===S.modus)return;if(S.buch.some(e=>e.nr)&&!confirm('Beim Wechsel der Arbeitsweise werden alle bisherigen Buchungen gelöscht. Fortfahren?'))return;const A=S.aufgabe,alt=S;ladeAufgabe(A,alt);S.modus=d.v;render();},
 hbf(d){S.hbf=d.v;render();},
 vgl(d){S.vgl=d.v==='1';render();},
 close(d){const k=d.k,g=abschlussListe(),it=[].concat(g.sub,g.erf,g.guv,g.best).find(x=>x.k===k),a=AD[k]||{},b=parseBetrag(a.b);if(!it)return;ADV[k]=(ADV[k]||0)+1;const fb=t=>{FB={g:'close',t:'err',html:'<b>'+esc(kname(k))+':</b> '+t};render();};
  if(isNaN(b))return fb('Bitte den Saldo als Betrag eingeben.');
  if(b!==Math.abs(it.saldo))return fb('Der Saldo stimmt nicht. Saldo = größere Seite − kleinere Seite.'+(ADV[k]>1?' (Summe Soll und Summe Haben stehen in der Zeile.)':''));
  if(!a.z)return fb('Bitte wähle das Konto, über das abgeschlossen wird.');
  if(S.modus==='uebung'&&a.z!==it.ziel){const K=konto(k);return fb(k==='8020'?'Der Gewinn oder Verlust wird auf das Eigenkapitalkonto übertragen.':K.sub?'Ein Unterkonto wird über sein Hauptkonto abgeschlossen.':(K.typ==='E'||K.typ==='W')?'Erfolgskonten (Aufwand und Ertrag) werden über das GuV-Konto abgeschlossen.':'Bestandskonten (Aktiv und Passiv) werden über das Schlussbilanzkonto abgeschlossen.');}
  schliesse(k,a.z);delete AD[k];FB={g:'close',t:'ok',html:'✓ '+esc(kname(k))+' ist abgeschlossen.'+(k==='8020'?' Der '+(it.saldo<0?'Gewinn':'Verlust')+' beträgt '+fmt(Math.abs(it.saldo))+' €.':'')};render();},
 closeall(){for(let i=0;i<3;i++){const g=abschlussListe();g.sub.concat(g.erf).forEach(x=>schliesse(x.k,x.ziel));}let g=abschlussListe();g.guv.forEach(x=>schliesse(x.k,x.ziel));g=abschlussListe();g.best.forEach(x=>schliesse(x.k,x.ziel));AD={};FB={g:'close',t:'ok',html:'✓ Alle restlichen Konten wurden automatisch abgeschlossen. Sieh dir die Buchungen im Grundbuch und auf den Konten an.'};render();},
 auswerten(){if(!confirm('Aufgabe jetzt abgeben? Danach kann nicht mehr gebucht werden.'))return;S.ausgewertet=true;render();},
 kz(d){S.kz=S.kz===d.id?null:d.id;FB=null;render();},
 kzshow(){S.kzOffen[S.kz]=true;render();},
 kzcheck(){const k=KZ.find(x=>x.id===S.kz),d=kzDaten(),soll=kzWert(k.w(d.sb,d.x)),v=parseFloat(String($('#kzin').value).replace('%','').replace(/\s/g,'').replace(',','.'));if(isNaN(v)){FB={g:'kz',t:'err',html:'Bitte dein Ergebnis als Zahl eingeben, z. B. 74,7.'};}else if(soll!=null&&Math.abs(v-soll)<=0.1){S.kzOffen[k.id]=true;FB={g:'kz',t:'ok',html:'✓ Richtig: '+pct(soll)};}else FB={g:'kz',t:'err',html:'Das passt noch nicht. Prüfe, welche Bilanzposten in Zähler und Nenner gehören (siehe Ausgangswerte unten).'};render();},
 hilfe(){MODAL=mHilfe;renderModal();},
 aufgaben(){MODAL=mAufgaben;renderModal();},
 dateien(){MODAL=mDateien;renderModal();},
 mclose(){MODAL=null;PICK=null;renderModal();},
 ovclose(d,el,ev){if(ev.target===el){MODAL=null;PICK=null;renderModal();}},
 pdf(){MODAL=null;renderModal();baueDruck();window.print();},
 expstand(){download('Stand_'+dateiName(S.aufgabe.titel)+'_'+dateiName(S.name||'Name')+'.json',JSON.stringify({format:'fow-buchen-stand',version:1,titel:S.aufgabe.titel,name:S.name,datum:new Date().toISOString(),d:enc(S)}));toast('Der Arbeitsstand wurde als Datei gesichert.');},
 import(){importDatei(o=>{if(o&&o.format==='fow-buchen-stand'&&o.d){let n;try{n=dec(o.d);}catch(e){n=null;}if(!n||!n.aufgabe){toast('Die Standdatei ist beschädigt.',true);return;}if(S.buch.some(e=>e.nr)&&!confirm('Der geladene Stand ersetzt die aktuelle Bearbeitung. Fortfahren?'))return;S=n;vorbereiten();FB=null;MODAL=null;render();toast('Arbeitsstand geladen.');return;}let A=null;try{A=leseAufgabe(o);}catch(e){}if(!A){toast('Die Datei ist keine gültige Aufgaben- oder Standdatei.',true);return;}if(wechsel(A))toast('Aufgabe geladen.');});},
 reset(){if(!confirm('Wirklich alle Buchungen dieser Aufgabe löschen?'))return;const alt=S;ladeAufgabe(S.aufgabe,alt);MODAL=null;render();},
 ladebuiltin(){wechsel(normAufgabe(dec(BUILTIN)));},
 laderepo(d){const r=REPO[+d.i];fetch('aufgaben/'+r.datei).then(x=>x.json()).then(o=>{const A=leseAufgabe(o);if(!A)throw 0;wechsel(A);}).catch(()=>toast('Die Aufgabe konnte nicht geladen werden.',true));},
 editor(){if(!ED){try{ED=JSON.parse(localStorage.getItem(EDKEY)||'null');}catch(e){}if(!ED)ED=edNeu();}MODAL=null;S.view='editor';render();window.scrollTo(0,0);},
 edzurueck(){S.view='start';render();},
 edfadd(d){ED[d.arr].push({nr:String(ED[d.arr].length+1),text:'',lsg:''});edSave();render();},
 edfdel(d){ED[d.arr].splice(+d.n,1);edSave();render();},
 edcheck(){ED.errs=edBauen().errs;render();},
 edexport(){const r=edBauen();ED.errs=r.errs;if(r.errs.length){render();toast('Bitte zuerst die markierten Punkte korrigieren.',true);return;}ED.id=r.task.id;edSave();download('Aufgabe_'+dateiName(r.task.titel)+'.json',JSON.stringify({format:'fow-buchen-aufgabe',version:1,titel:r.task.titel,d:enc(r.task)}));render();toast('Aufgabendatei exportiert.');},
 edtest(){const r=edBauen();ED.errs=r.errs;if(r.errs.length){render();return;}edSave();ladeAufgabe(r.task,S);render();window.scrollTo(0,0);toast('Aufgabe zum Testen geladen.');},
 edleer(){if(!confirm('Formular wirklich leeren?'))return;ED=edNeu();edSave();render();},
 edopen(){importDatei(o=>{let A=null;try{A=leseAufgabe(o);}catch(e){}if(!A){toast('Keine gültige Aufgabendatei.',true);return;}if(A.pin&&prompt('Lehrer-PIN dieser Aufgabe:')!==A.pin){toast('Die PIN ist nicht richtig.',true);return;}ED=edAus(A);edSave();render();});},
 edbild(){importDatei(url=>{if(url.length>1500000)toast('Das Bild ist sehr groß. Kleinere Bilder laden schneller.',true);ED.bild=url;edSave();render();},'image/*');},
 edbildweg(){ED.bild='';edSave();render();}
};
const INP={
 betrag(el){S.draft[el.dataset.s][+el.dataset.n].b=el.value;const w=$('#waage');if(w)w.outerHTML=waageHtml();},
 name(el){S.name=el.value;},klasse(el){S.klasse=el.value;},
 ksuche(el){PICK.q=el.value;$('#klist').innerHTML=pickList();},
 ad(el){(AD[el.dataset.k]=AD[el.dataset.k]||{b:'',z:''})[el.dataset.f]=el.value;},
 ed(el){ED[el.dataset.f]=el.value;ED.errs=null;edSave();},
 edf(el){ED[el.dataset.arr][+el.dataset.n][el.dataset.f]=el.value;ED.errs=null;edSave();}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;const f=AKT[el.dataset.a];if(f)f(el.dataset,el,ev);});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset&&el.dataset.i&&INP[el.dataset.i])INP[el.dataset.i](el);});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset&&el.dataset.i&&INP[el.dataset.i]){if(el.tagName==='SELECT')INP[el.dataset.i](el);if(S&&!PICK)save();}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&MODAL){MODAL=null;PICK=null;renderModal();}if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.i==='betrag'){const b=$('[data-a="buchen"]');if(b)b.click();}});
window.addEventListener('beforeprint',baueDruck);

/* ---------- Start ---------- */
(function start(){
 if(!restore())ladeAufgabe(normAufgabe(dec(BUILTIN)));
 if(S.view==='editor')S.view='start';
 render();
 if(location.protocol.startsWith('http')){
  fetch('aufgaben/index.json').then(r=>r.ok?r.json():[]).then(l=>{if(Array.isArray(l))REPO=l.filter(x=>x&&x.datei);
   const p=new URLSearchParams(location.search).get('aufgabe');if(p&&/^[\w.\-äöüÄÖÜß]+\.json$/.test(p)&&!S.buch.some(e=>e.nr))fetch('aufgaben/'+p).then(r=>r.json()).then(o=>{const A=leseAufgabe(o);if(A&&A.id!==S.aufgabe.id){ladeAufgabe(A,S);render();}}).catch(()=>{});
  }).catch(()=>{});
 }
})();
window.__app={get S(){return S;},AKT,salden,bilanzAus,erfolg,abschlussFertig,get FAELLE(){return FAELLE;},kzDaten,KZ,kzWert,edBauen,set ED(v){ED=v;},get ED(){return ED;},edNeu,edAus,enc,dec,unposted,auswertung};
